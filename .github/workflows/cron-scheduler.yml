name: High-Frequency Cron Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-cron:
    name: Ping Scheduled Webhooks
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://www.likhangkamay.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.VERCEL_CRON_SECRET }}
    steps:
      - name: Verify cron credential is configured
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Set the GitHub CRON_SECRET to match the Vercel production CRON_SECRET.'
            exit 1
          fi

      - name: Trigger Queue Worker Webhook
        id: queue
        run: |
          curl --silent --show-error --fail --max-time 15 --output /dev/null \
            -H "X-Vercel-Cron-Secret: $CRON_SECRET" \
            "${APP_URL%/}/webhooks/cron/queue"

      - name: Trigger Schedule Runner Webhook
        if: ${{ !cancelled() && steps.queue.outcome != 'skipped' }}
        run: |
          curl --silent --show-error --fail --max-time 15 --output /dev/null \
            -H "X-Vercel-Cron-Secret: $CRON_SECRET" \
            "${APP_URL%/}/webhooks/cron"
