name: Dual-Database Compatibility Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dual-database-verification:
    name: Verify MySQL & PostgreSQL Parity
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: likhangkamay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: likhangkamay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_pgsql, pgsql, bcmath, zip, gd
          coverage: none

      - name: Copy Environment Configuration
        run: cp .env.example .env

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Strict Dual-Database Verification
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: likhangkamay_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: likhangkamay_test
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ''
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: likhangkamay_test
          PGSQL_USERNAME: postgres
          PGSQL_PASSWORD: password
        run: |
          php artisan db:verify-dual --strict --all

      - name: Run Test Suite on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: likhangkamay_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: likhangkamay_test
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ''
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: likhangkamay_test
          PGSQL_USERNAME: postgres
          PGSQL_PASSWORD: password
        run: php artisan test --filter=DualDatabaseCompatibilityTest

      - name: Run Test Suite on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: likhangkamay_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: likhangkamay_test
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ''
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: likhangkamay_test
          PGSQL_USERNAME: postgres
          PGSQL_PASSWORD: password
        run: php artisan test --filter=DualDatabaseCompatibilityTest
